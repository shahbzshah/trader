<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gold Signals — XAUUSD</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c232c;
    --border: #2a313a;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --orange: #d29922;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
  header .meta { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .toolbar { display: flex; gap: 8px; align-items: center; }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    font-family: inherit;
  }
  button:hover { background: #232a33; }
  button.danger { color: var(--red); border-color: #4a2a2a; }
  button.danger:hover { background: #2a1a1a; }
  button.success { color: var(--green); border-color: #2a4a2e; }
  button.success:hover { background: #1a2a1d; }
  .kill-banner {
    display: none;
    background: var(--red); color: white; padding: 10px 20px; font-weight: 600;
    text-align: center;
  }
  .kill-banner.active { display: block; }
  main {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    padding: 20px; max-width: 1100px; margin: 0 auto;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px;
  }
  .card h2 { margin: 0 0 12px 0; font-size: 13px; text-transform: uppercase;
              letter-spacing: 0.5px; color: var(--muted); }
  .wide { grid-column: 1 / -1; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
  .kv { display: flex; justify-content: space-between; padding: 4px 0;
        border-bottom: 1px dashed #21272e; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--muted); }
  .kv .v { font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px;
          font-size: 11px; font-weight: 600; }
  .pill.live { background: #1a3a1d; color: var(--green); }
  .pill.dead { background: #3a3a3a; color: var(--muted); }
  .pill.kill { background: var(--red); color: white; }
  .pill.buy { background: #1a3a1d; color: var(--green); }
  .pill.sell { background: #4a2a2a; color: var(--red); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px;
        text-transform: uppercase; letter-spacing: 0.5px; }
  td.num { text-align: right; }
  tr.disapproved td { color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  .links a { color: var(--accent); text-decoration: none; margin-right: 12px; }
  .links a:hover { text-decoration: underline; }
  footer { padding: 12px 20px; color: var(--muted); font-size: 11px;
           text-align: center; border-top: 1px solid var(--border); }
  .signal-big { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .signal-big .buy { color: var(--green); }
  .signal-big .sell { color: var(--red); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Gold Signals — XAUUSD</h1>
    <span class="meta" id="ts">—</span>
    <span class="meta" id="feed-pill"></span>
  </div>
  <div class="toolbar">
    <button id="refresh" type="button">Refresh</button>
    <button id="resume" class="success" type="button">Resume</button>
    <button id="kill" class="danger" type="button">Kill Switch</button>
  </div>
</header>
<div id="banner" class="kill-banner">KILL SWITCH ENGAGED — NO NEW SIGNALS</div>
<main>
  <section class="card" id="feed">
    <h2>Feed</h2>
    <div id="feed-content"><div class="empty">Loading…</div></div>
  </section>
  <section class="card" id="today">
    <h2>Today</h2>
    <div id="today-content"><div class="empty">Loading…</div></div>
  </section>
  <section class="card wide" id="last-signal">
    <h2>Last Signal</h2>
    <div id="last-signal-content"><div class="empty">No signal yet.</div></div>
  </section>
  <section class="card wide" id="signals">
    <h2>Signals</h2>
    <div id="signals-content"><div class="empty">Loading…</div></div>
    <div class="links" style="margin-top: 8px;">
      <a href="/health" target="_blank">/health</a>
      <a href="/api/state" target="_blank">/api/state</a>
      <a href="/api/signals" target="_blank">/api/signals</a>
      <a href="/api/decisions" target="_blank">/api/decisions</a>
    </div>
  </section>
  <section class="card wide" id="decisions">
    <h2>Recent Decisions</h2>
    <div id="decisions-content"><div class="empty">Loading…</div></div>
  </section>
</main>
<footer>
  <span>Signals only — no trades are placed by this bot · Auto-refresh every 10s</span>
</footer>
<script>
const REFRESH_MS = 10000;
const fmt = (v, d = 2) => (v === null || v === undefined) ? "—" :
  Number(v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtInt = (v) => (v === null || v === undefined) ? "—" : Number(v).toLocaleString();
const ts = (s) => {
  if (!s) return "—";
  const d = new Date(s * 1000);
  return d.toLocaleString();
};
const ageLabel = (secs) => {
  if (secs === null || secs === undefined) return "—";
  if (secs < 60) return secs + "s ago";
  if (secs < 3600) return Math.floor(secs / 60) + "m ago";
  return Math.floor(secs / 3600) + "h ago";
};

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`${url} -> ${r.status}`);
  return await r.json();
}
async function postJSON(url) {
  const r = await fetch(url, { method: "POST" });
  if (!r.ok) throw new Error(`${url} -> ${r.status}`);
  return await r.json();
}

function renderFeed(feed) {
  document.getElementById("ts").textContent = new Date().toLocaleString();
  const pill = document.getElementById("feed-pill");
  pill.innerHTML = feed.feed_ok
    ? `<span class="pill live">feed ${feed.name || "?"} live</span>`
    : `<span class="pill dead">feed ${feed.name || "?"} down</span>`;
  const html = `
    <div class="grid-2">
      <div class="kv"><span class="k">Source</span><span class="v">${feed.name || "—"}</span></div>
      <div class="kv"><span class="k">Status</span><span class="v">${feed.feed_ok ? "OK" : "DOWN"}</span></div>
      <div class="kv"><span class="k">Last tick</span><span class="v">${ageLabel(feed.last_tick_age_s)}</span></div>
      <div class="kv"><span class="k">Ticks seen</span><span class="v">${fmtInt(feed.tick_count)}</span></div>
    </div>
    ${feed.last_error ? `<div style="color: var(--orange); margin-top: 8px; font-size: 12px;">${feed.last_error}</div>` : ""}`;
  document.getElementById("feed-content").innerHTML = html;
}

function renderToday(today) {
  const html = `
    <div class="grid-2">
      <div class="kv"><span class="k">Decisions</span><span class="v">${fmtInt(today.decision_count)}</span></div>
      <div class="kv"><span class="k">Signals sent</span><span class="v">${fmtInt(today.signals)}</span></div>
      <div class="kv"><span class="k">Approved</span><span class="v">${fmtInt(today.approved)}</span></div>
      <div class="kv"><span class="k">Rejected</span><span class="v">${fmtInt(today.rejected)}</span></div>
    </div>`;
  document.getElementById("today-content").innerHTML = html;
}

function signalHeadline(s) {
  const dir = (s.direction || "").toLowerCase();
  const cls = dir === "buy" ? "buy" : "sell";
  const label = dir === "buy" ? "BUY" : "SELL";
  return `<div class="signal-big"><span class="${cls}">${label}</span> ${s.symbol || ""} @ ${fmt(s.entry)}</div>`;
}

function renderLastSignal(last) {
  if (!last) {
    document.getElementById("last-signal-content").innerHTML = '<div class="empty">No signal yet.</div>';
    return;
  }
  document.getElementById("last-signal-content").innerHTML = `
    ${signalHeadline(last)}
    <div class="grid-2">
      <div class="kv"><span class="k">Stop loss</span><span class="v">${fmt(last.stop_loss)}</span></div>
      <div class="kv"><span class="k">Take profit</span><span class="v">${fmt(last.take_profit)}</span></div>
      <div class="kv"><span class="k">Risk</span><span class="v">${fmt(last.risk_pct, 1)}%</span></div>
      <div class="kv"><span class="k">Confidence</span><span class="v">${fmt(last.confidence, 2)}</span></div>
      <div class="kv"><span class="k">Time</span><span class="v">${ts(last.ts)}</span></div>
      <div class="kv"><span class="k">Playbook</span><span class="v">${last.playbook || "—"}</span></div>
    </div>
    <div style="color: var(--muted); margin-top: 8px; font-size: 12px;">${last.reasoning || ""}</div>`;
}

function renderSignals(signals) {
  if (!signals || !signals.length) {
    document.getElementById("signals-content").innerHTML = '<div class="empty">No signals yet.</div>';
    return;
  }
  const rows = signals.slice(0, 25).map(s => {
    const dir = (s.direction || "").toLowerCase();
    const pill = dir === "buy"
      ? '<span class="pill buy">BUY</span>' : '<span class="pill sell">SELL</span>';
    return `<tr>
      <td>${ts(s.ts)}</td>
      <td>${s.symbol}</td>
      <td>${pill}</td>
      <td class="num">${fmt(s.entry)}</td>
      <td class="num">${fmt(s.stop_loss)}</td>
      <td class="num">${fmt(s.take_profit)}</td>
      <td class="num">${fmt(s.risk_pct, 1)}%</td>
      <td class="num">${fmt(s.confidence, 2)}</td>
    </tr>`;
  }).join("");
  document.getElementById("signals-content").innerHTML = `
    <table>
      <thead><tr>
        <th>Time</th><th>Symbol</th><th>Side</th>
        <th class="num">Entry</th><th class="num">SL</th><th class="num">TP</th>
        <th class="num">Risk</th><th class="num">Conf.</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderDecisions(decisions) {
  if (!decisions || !decisions.length) {
    document.getElementById("decisions-content").innerHTML = '<div class="empty">No decisions yet.</div>';
    return;
  }
  const rows = decisions.slice(0, 25).map(d => {
    const reason = (d.reasoning || "").slice(0, 80);
    const status = d.approved
      ? '<span class="pill live">approved</span>'
      : '<span class="pill kill">rejected</span>';
    return `<tr class="${d.approved ? '' : 'disapproved'}">
      <td>${ts(d.ts)}</td>
      <td>${d.symbol}</td>
      <td>${d.action}</td>
      <td>${d.playbook || "—"}</td>
      <td class="num">${fmt(d.confidence, 2)}</td>
      <td>${status}</td>
      <td>${reason}</td>
    </tr>`;
  }).join("");
  document.getElementById("decisions-content").innerHTML = `
    <table>
      <thead><tr>
        <th>Time</th><th>Symbol</th><th>Action</th><th>Playbook</th>
        <th class="num">Conf.</th><th>Status</th><th>Reasoning</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function refresh() {
  try {
    const state = await getJSON("/api/state");
    document.getElementById("banner").classList.toggle("active", !!state.kill_switch);
    renderFeed(state.feed);
    renderToday(state.today);
    renderLastSignal(state.last_signal);
    const [signals, decisions] = await Promise.all([
      getJSON("/api/signals?limit=25"),
      getJSON("/api/decisions?limit=25"),
    ]);
    renderSignals(signals.signals);
    renderDecisions(decisions.decisions);
  } catch (e) {
    console.error("refresh failed:", e);
  }
}

document.getElementById("refresh").addEventListener("click", refresh);
document.getElementById("kill").addEventListener("click", async () => {
  if (!confirm("Engage kill switch? No new signals will be sent.")) return;
  await postJSON("/api/kill");
  await refresh();
});
document.getElementById("resume").addEventListener("click", async () => {
  if (!confirm("Release kill switch and allow new signals?")) return;
  await postJSON("/api/resume");
  await refresh();
});

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
