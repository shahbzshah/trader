mode: demo

symbols:
  - XAUUSD

timeframes:
  - M15
  - H1

schedule:
  scan_interval_minutes: 15

session_hours:
  start: "00:00"
  end: "23:59"
  timezone: "UTC"
  skip_weekends: true

# Kill zones REMOVED 2026-11-03 on Megah's order ("not happy with them"):
# entries are no longer restricted to London/New York windows. The bot
# now scans and signals in every session while the market is open.
# Empty list = no kill-zone filter (session_hours still applies).
kill_zones: []

risk:
  max_risk_pct_per_trade: 1.0
  max_daily_loss_pct: 3.0
  max_open_trades: 3
  max_trades_per_day: 5
  min_confidence: 0.6
  # NO breakeven manager: manage.py was deleted 2026-11-04 and
  # breakeven was never backtested with phil-rudy-v2 — moving the
  # stop to entry would change the backtested numbers. The $10 stop
  # stays where the signal put it until the flip or the stop exits.
  breakeven_enabled: false
  breakeven_at_r: 1.0

# Strategy: Phil v2 triangles filtered by RUDY's internal trend
# ("V2 pair", live 2026-11-11, Megah's order "combine the 2").
# Backtested on frozen Deriv frxXAUUSD M15, 24 Feb–10 Nov 2026:
# 151 signals, 100 trades, 48.0% win, +$15.95/trade (no stop);
# with the $10 stop: 139 trades, 20.1% win, +$7.60/trade.
# Rules live in app/strategy.py + knowledge/playbooks/phil_rudy_v2.md.
strategy:
  name: "phil-rudy-v2"
  phil_rudy:
    max_dist_usd: 20.0      # |close - ma55| <= $20 at the signal bar
    min_sep_813_usd: 0.75   # |ma8 - ma13| >= $0.75 at the signal bar
    stop_usd: 10.0          # Megah's standing stop loss, always $10
    warmup_bars: 300        # bars discarded (EMA + structure warmup)
    history_bars: 400       # M15 bars fetched per cycle (warmup + margin)

news:
  enabled: true
  currencies: ["USD"]   # gold-only: USD events move XAUUSD; add EUR/GBP if needed
  min_impact: "High"
  window_minutes: 30    # no_trade within ±30 min of a high-impact USD event

# Signals-only operation (no MT5, no trade execution).
# Signals are sized against the hypothetical balance below, never real
# money: lots = risk$ / (SL$ x 100) for gold (1 lot = 100 oz).
signals:
  hypothetical_balance_usd: 10000.0
  feed: auto        # oanda (main) | deriv (fallback) | auto
  telegram_enabled: true
  max_signals_per_day: 5

dashboard:
  host: "127.0.0.1"
  port: 8765

paths:
  data_dir: "data"
  logs_dir: "logs"
  reports_dir: "reports"
  knowledge_dir: "knowledge"
  kill_switch_path: "data/KILL_SWITCH"